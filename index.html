<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>승부 예측 베팅</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: #0b0c10; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        /* 모바일 꽉 찬 프레임 레이아웃 */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 880px;
            background: #12141d;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #222638;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 헤더 & 내 포인트 현황 */
        .header {
            text-align: center;
            padding: 6px 0;
            border-bottom: 1px solid #1f2436;
        }
        .header h2 { font-size: 18px; color: #00f0ff; letter-spacing: 1px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.4); }
        .point-display {
            margin-top: 6px;
            font-size: 15px;
            font-weight: 800;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* 화면 꽉 차는 반반(Split) 구역 */
        .split-board {
            flex: 1;
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .team-card {
            flex: 1;
            border-radius: 18px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .team-card.red {
            background: linear-gradient(180deg, #2a0813 0%, #17040a 100%);
            border: 2px solid #ff0055;
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.3), 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .team-card.blue {
            background: linear-gradient(180deg, #081a2a 0%, #040e17 100%);
            border: 2px solid #0066ff;
            box-shadow: inset 0 0 15px rgba(0, 102, 255, 0.3), 0 0 15px rgba(0, 102, 255, 0.2);
        }

        .team-card:active { transform: scale(0.96); }

        .team-title { font-size: 22px; font-weight: 900; }
        .red .team-title { color: #ff4d79; text-shadow: 0 0 10px rgba(255, 77, 121, 0.6); }
        .blue .team-title { color: #4d94ff; text-shadow: 0 0 10px rgba(77, 148, 255, 0.6); }

        .percent-val { font-size: 36px; font-weight: 900; }
        .total-pts { font-size: 13px; color: #a0a5b5; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 12px; }

        /* 코인(칩) 선택 세션 */
        .chip-section {
            background: #181b26;
            padding: 14px 10px;
            border-radius: 18px;
            border: 1px solid #222638;
            text-align: center;
        }
        .chip-label { font-size: 12px; color: #8a8f9d; margin-bottom: 10px; }

        .chip-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .chip {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            border: 4px dashed rgba(255,255,255,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
        }

        .chip[data-val="50"] { background: #ff4d4f; color: white; }
        .chip[data-val="100"] { background: #1890ff; color: white; }
        .chip[data-val="200"] { background: #52c41a; color: white; }
        .chip[data-val="500"] { background: #faad14; color: black; }

        .chip.selected {
            transform: scale(1.18);
            border: 4px solid #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }

        /* 하단 안내 메시지 */
        .status-box {
            text-align: center;
            font-size: 13px;
            color: #00f0ff;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>⚔️ 학예회 승부예측</h2>
        <div class="point-display">💰 My Point: <span id="myPoint">1000</span> P</div>
    </div>

    <!-- 반반 Split 구역 -->
    <div class="split-board">
        <div id="btnRed" class="team-card red" onclick="vote('red')">
            <div class="team-title">🔴 RED</div>
            <div id="pRed" class="percent-val">50%</div>
            <div id="cRed" class="total-pts">0 P</div>
        </div>
        <div id="btnBlue" class="team-card blue" onclick="vote('blue')">
            <div class="team-title">🔵 BLUE</div>
            <div id="pBlue" class="percent-val">50%</div>
            <div id="cBlue" class="total-pts">0 P</div>
        </div>
    </div>

    <!-- 코인 선택 메뉴 -->
    <div class="chip-section">
        <div class="chip-label">투자할 코인을 선택한 후 팀 카드를 터치하세요!</div>
        <div class="chip-container">
            <div class="chip selected" data-val="50" onclick="selectChip(50, this)">50</div>
            <div class="chip" data-val="100" onclick="selectChip(100, this)">100</div>
            <div class="chip" data-val="200" onclick="selectChip(200, this)">200</div>
            <div class="chip" data-val="500" onclick="selectChip(500, this)">500</div>
        </div>
    </div>

    <div id="statusMsg" class="status-box">응원하는 팀을 터치해 포인트를 투표하세요!</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyANb0ouAJ9D9fEWcisDVZfvS75JEkS5GIE",
        authDomain: "firstdb-4a3c9.firebaseapp.com",
        databaseURL: "https://firstdb-4a3c9-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "firstdb-4a3c9",
        storageBucket: "firstdb-4a3c9.firebasestorage.app",
        messagingSenderId: "821652794885",
        appId: "1:821652794885:web:678488cac08c5ba9acf66c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 초기 포인트 세팅 (기본 1000P)
    let currentPoint = localStorage.getItem('userPoint');
    if (currentPoint === null) {
        currentPoint = 1000;
        localStorage.setItem('userPoint', currentPoint);
    } else {
        currentPoint = parseInt(currentPoint);
    }
    document.getElementById('myPoint').innerText = currentPoint.toLocaleString();

    let selectedAmount = 50;

    function selectChip(amount, el) {
        selectedAmount = amount;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    function vote(team) {
        if (currentPoint < selectedAmount) {
            document.getElementById('statusMsg').innerText = "❌ 포인트가 부족합니다!";
            return;
        }

        // 보유 포인트 차감
        currentPoint -= selectedAmount;
        localStorage.setItem('userPoint', currentPoint);
        document.getElementById('myPoint').innerText = currentPoint.toLocaleString();

        // 파이어베이스 데이터베이스 누적 업데이트
        db.ref('votes/' + team).transaction((current) => (current || 0) + selectedAmount);

        const teamName = team === 'red' ? '레드' : '블루';
        document.getElementById('statusMsg').innerText = `✅ ${teamName}팀에 ${selectedAmount}P 응원 투표 완료!`;
    }

    // 실시간 수치 데이터 로드 및 퍼센티지 계산
    db.ref('votes').on('value', (snapshot) => {
        const data = snapshot.val() || { red: 0, blue: 0 };
        const red = data.red || 0;
        const blue = data.blue || 0;
        const total = red + blue;

        let rP = 50, bP = 50;
        if (total > 0) {
            rP = Math.round((red / total) * 100);
            bP = 100 - rP;
        }

        document.getElementById('pRed').innerText = rP + '%';
        document.getElementById('pBlue').innerText = bP + '%';
        document.getElementById('cRed').innerText = red.toLocaleString() + ' P';
        document.getElementById('cBlue').innerText = blue.toLocaleString() + ' P';
    });
</script>
</body>
</html>
