<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학예회 실시간 승부예측</title>
    <!-- Firebase 실시간 연결 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 30px 15px; background: #f4f6f9; }
        h1 { color: #333; }
        p { color: #666; margin-bottom: 25px; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        button { padding: 16px 32px; font-size: 20px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; }
        .red-btn { background-color: #ff4d4f; }
        .blue-btn { background-color: #1890ff; }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; }
        
        /* 실시간 비율 바 */
        .progress-bar-container { width: 90%; max-width: 500px; height: 36px; background: #e0e0e0; margin: 0 auto; border-radius: 18px; overflow: hidden; display: flex; }
        .red-bar { background: #ff4d4f; height: 100%; width: 50%; transition: width 0.4s ease; }
        .blue-bar { background: #1890ff; height: 100%; width: 50%; transition: width 0.4s ease; }
        
        .result-text { font-size: 24px; font-weight: bold; margin-top: 20px; }
        #statusMsg { font-size: 15px; color: #888; margin-top: 12px; }
    </style>
</head>
<body>

    <h1>🏆 학예회 승부예측 투표</h1>
    <p>원하는 팀에 투표하세요! (1인 1회 제한)</p>

    <div class="btn-container">
        <button id="redBtn" class="red-btn" onclick="vote('red')">🔴 레드 팀</button>
        <button id="blueBtn" class="blue-btn" onclick="vote('blue')">🔵 블루 팀</button>
    </div>

    <div class="progress-bar-container">
        <div id="redBar" class="red-bar"></div>
        <div id="blueBar" class="blue-bar"></div>
    </div>

    <div class="result-text">
        🔴 레드: <span id="redPercent">50</span>% | 🔵 블루: <span id="bluePercent">50</span>%
    </div>
    <p id="statusMsg"></p>

    <script>
        // 파이어베이스 연결 정보
        const firebaseConfig = {
            apiKey: "AIzaSyANb0ouAJ9D9fEWcisDVZfvS75JEkS5GIE",
            authDomain: "firstdb-4a3c9.firebaseapp.com",
            databaseURL: "https://firstdb-4a3c9-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "firstdb-4a3c9",
            storageBucket: "firstdb-4a3c9.firebasestorage.app",
            messagingSenderId: "821652794885",
            appId: "1:821652794885:web:678488cac08c5ba9acf66c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        if (localStorage.getItem('voted')) {
            disableButtons("이미 투표에 참여하셨습니다.");
        }

        function vote(team) {
            if (localStorage.getItem('voted')) return;

            db.ref('votes/' + team).transaction((currentVotes) => {
                return (currentVotes || 0) + 1;
            });

            localStorage.setItem('voted', team);
            disableButtons("투표가 완료되었습니다!");
        }

        function disableButtons(msg) {
            document.getElementById('redBtn').disabled = true;
            document.getElementById('blueBtn').disabled = true;
            document.getElementById('statusMsg').innerText = msg;
        }

        // 데이터베이스 수신 및 화면 갱신
        db.ref('votes').on('value', (snapshot) => {
            const data = snapshot.val() || { red: 0, blue: 0 };
            const redVotes = data.red || 0;
            const blueVotes = data.blue || 0;
            const totalVotes = redVotes + blueVotes;

            let redPercent = 50;
            let bluePercent = 50;

            if (totalVotes > 0) {
                redPercent = Math.round((redVotes / totalVotes) * 100);
                bluePercent = 100 - redPercent;
            }

            document.getElementById('redPercent').innerText = redPercent;
            document.getElementById('bluePercent').innerText = bluePercent;
            document.getElementById('redBar').style.width = redPercent + '%';
            document.getElementById('blueBar').style.width = bluePercent + '%';
        });
    </script>
</body>
</html>
