<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학예회 실시간 승부예측</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: #0b0c10; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        /* 모바일 프레임 레이아웃 */
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #12141d;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 240, 255, 0.1);
            border: 1px solid #222638;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 헤더 */
        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #1f2436;
        }
        .header h2 { font-size: 20px; color: #00f0ff; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .header p { font-size: 12px; color: #8a8f9d; margin-top: 4px; }

        /* 메인 배팅 카드 영역 (3구역 배치) */
        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            background: #1a1d2a;
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* 각 영역 색상 지정 */
        .card.red { border: 2px solid #ff0055; box-shadow: inset 0 0 12px rgba(255, 0, 85, 0.2); }
        .card.draw { border: 2px solid #00ff66; box-shadow: inset 0 0 12px rgba(0, 255, 102, 0.2); grid-column: span 1; }
        .card.blue { border: 2px solid #0066ff; box-shadow: inset 0 0 12px rgba(0, 102, 255, 0.2); }

        .card:active { transform: scale(0.95); }
        .card.disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .card-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
        .red .card-title { color: #ff4d79; }
        .draw .card-title { color: #00ff66; }
        .blue .card-title { color: #4d94ff; }

        .percent-tag {
            font-size: 22px;
            font-weight: 900;
            margin: 6px 0;
        }

        .vote-count {
            font-size: 11px;
            color: #a0a5b5;
            background: rgba(0,0,0,0.4);
            padding: 4px 8px;
            border-radius: 10px;
            width: 100%;
        }

        /* 퍼센트 비주얼 게이지 */
        .gauge-container {
            width: 100%;
            height: 12px;
            background: #0b0c10;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            margin-top: 10px;
            border: 1px solid #222638;
        }
        .gauge-red { background: #ff0055; height: 100%; width: 33.3%; transition: width 0.4s ease; }
        .gauge-draw { background: #00ff66; height: 100%; width: 33.3%; transition: width 0.4s ease; }
        .gauge-blue { background: #0066ff; height: 100%; width: 33.4%; transition: width 0.4s ease; }

        /* 하단 상태 표시 */
        .status-box {
            text-align: center;
            background: #181b26;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #00f0ff;
            border: 1px solid #222638;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>⚔️ 학예회 승부예측</h2>
        <p>실시간 수치 현황 (1인 1회 참여)</p>
    </div>

    <!-- 게이지 바 -->
    <div class="gauge-container">
        <div id="gRed" class="gauge-red"></div>
        <div id="gDraw" class="gauge-draw"></div>
        <div id="gBlue" class="gauge-blue"></div>
    </div>

    <!-- 카드 보드 -->
    <div class="game-board">
        <!-- 레드 -->
        <div id="btnRed" class="card red" onclick="vote('red')">
            <div class="card-title">🔴 레드팀</div>
            <div id="pRed" class="percent-tag">0%</div>
            <div id="cRed" class="vote-count">0 표</div>
        </div>

        <!-- 무승부 -->
        <div id="btnDraw" class="card draw" onclick="vote('draw')">
            <div class="card-title">🟢 무승부</div>
            <div id="pDraw" class="percent-tag">0%</div>
            <div id="cDraw" class="vote-count">0 표</div>
        </div>

        <!-- 블루 -->
        <div id="btnBlue" class="card blue" onclick="vote('blue')">
            <div class="card-title">🔵 블루팀</div>
            <div id="pBlue" class="percent-tag">0%</div>
            <div id="cBlue" class="vote-count">0 표</div>
        </div>
    </div>

    <div id="statusMsg" class="status-box">원하는 항목을 터치하여 예측에 참여하세요!</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyANb0ouAJ9D9fEWcisDVZfvS75JEkS5GIE",
        authDomain: "firstdb-4a3c9.firebaseapp.com",
        databaseURL: "https://firstdb-4a3c9-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "firstdb-4a3c9",
        storageBucket: "firstdb-4a3c9.firebasestorage.app",
        messagingSenderId: "821652794885",
        appId: "1:821652794885:web:678488cac08c5ba9acf66c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    if (localStorage.getItem('voted')) {
        disableAll("이미 예측에 참여하셨습니다.");
    }

    function vote(team) {
        if (localStorage.getItem('voted')) return;

        db.ref('votes/' + team).transaction((current) => (current || 0) + 1);
        localStorage.setItem('voted', team);
        disableAll("예측 투표가 정상 접수되었습니다!");
    }

    function disableAll(msg) {
        document.getElementById('btnRed').classList.add('disabled');
        document.getElementById('btnDraw').classList.add('disabled');
        document.getElementById('btnBlue').classList.add('disabled');
        document.getElementById('statusMsg').innerText = msg;
    }

    db.ref('votes').on('value', (snapshot) => {
        const data = snapshot.val() || { red: 0, draw: 0, blue: 0 };
        const red = data.red || 0;
        const draw = data.draw || 0;
        const blue = data.blue || 0;
        const total = red + draw + blue;

        let rP = 0, dP = 0, bP = 0;
        if (total > 0) {
            rP = Math.round((red / total) * 100);
            dP = Math.round((draw / total) * 100);
            bP = 100 - (rP + dP);
        }

        // 숫자 갱신
        document.getElementById('pRed').innerText = rP + '%';
        document.getElementById('pDraw').innerText = dP + '%';
        document.getElementById('pBlue').innerText = bP + '%';

        document.getElementById('cRed').innerText = red + ' 표';
        document.getElementById('cDraw').innerText = draw + ' 표';
        document.getElementById('cBlue').innerText = blue + ' 표';

        // 게이지 바 폭 조정
        document.getElementById('gRed').style.width = (total ? rP : 33.3) + '%';
        document.getElementById('gDraw').style.width = (total ? dP : 33.3) + '%';
        document.getElementById('gBlue').style.width = (total ? bP : 33.4) + '%';
    });
</script>
</body>
</html>
