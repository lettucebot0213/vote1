<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 승부예측 베팅</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: #0b0c10; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 880px;
            background: #12141d;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #222638;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 6px 0;
            border-bottom: 1px solid #1f2436;
        }
        .header h2 { font-size: 18px; color: #00f0ff; letter-spacing: 1px; cursor: pointer; }
        .user-id-tag { font-size: 11px; color: #00ff66; margin-top: 3px; font-weight: bold; }

        .point-display {
            margin-top: 6px;
            font-size: 15px;
            font-weight: 800;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .split-board {
            flex: 1;
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .team-card {
            flex: 1;
            border-radius: 18px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, border 0.2s;
        }

        .team-card.red {
            background: linear-gradient(180deg, #2a0813 0%, #17040a 100%);
            border: 2px solid #ff0055;
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .team-card.blue {
            background: linear-gradient(180deg, #081a2a 0%, #040e17 100%);
            border: 2px solid #0066ff;
            box-shadow: inset 0 0 15px rgba(0, 102, 255, 0.3);
        }

        .team-card.locked {
            opacity: 0.35;
            filter: grayscale(80%);
            cursor: not-allowed;
        }

        .team-card:active { transform: scale(0.96); }

        .team-title { font-size: 22px; font-weight: 900; }
        .red .team-title { color: #ff4d79; }
        .blue .team-title { color: #4d94ff; }

        .percent-val { font-size: 36px; font-weight: 900; }
        .total-pts { font-size: 12px; color: #a0a5b5; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 12px; }

        .chip-section {
            background: #181b26;
            padding: 12px 10px;
            border-radius: 18px;
            border: 1px solid #222638;
            text-align: center;
        }
        .chip-label { font-size: 11px; color: #8a8f9d; margin-bottom: 8px; }

        .chip-container { display: flex; justify-content: space-around; align-items: center; }

        .chip {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            border: 3px dashed rgba(255,255,255,0.3);
            transition: all 0.2s ease;
        }

        .chip[data-val="50"] { background: #ff4d4f; color: white; }
        .chip[data-val="100"] { background: #1890ff; color: white; }
        .chip[data-val="200"] { background: #52c41a; color: white; }
        .chip[data-val="500"] { background: #faad14; color: black; }

        .chip.selected { transform: scale(1.15); border: 3px solid #ffffff; box-shadow: 0 0 12px #ffffff; }

        .status-box { text-align: center; font-size: 12px; color: #00f0ff; min-height: 18px; font-weight: bold; }

        /* 모달 레이아웃 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            border-radius: 20px;
            z-index: 100;
            padding: 20px;
            flex-direction: column;
            gap: 10px;
        }

        .nick-input-box {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .nick-input-box input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #00f0ff;
            background: #181b26;
            color: white;
            font-size: 16px;
            text-align: center;
            user-select: auto;
        }

        .admin-user-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #181b26; 
            padding: 10px 12px; 
            border-radius: 8px; 
            font-size: 12px; 
        }

        .close-btn { background: #ff4d4f; border: none; padding: 10px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: auto; }
        .action-btn { padding: 10px; background: #222638; border: 1px solid #00f0ff; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .settle-red { background: #2a0813; border: 1px solid #ff0055; color: #ff4d79; }
        .settle-blue { background: #081a2a; border: 1px solid #0066ff; color: #4d94ff; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2 onclick="tryAdminAccess()">⚔️ 학예회 승부예측 ⚙️</h2>
        <div id="myNickDisplay" class="user-id-tag">닉네임 설정 중...</div>
        <div class="point-display">💰 내 포인트: <span id="myPoint">...</span> P</div>
    </div>

    <!-- 반반 Split 구역 -->
    <div class="split-board">
        <div id="btnRed" class="team-card red" onclick="vote('red')">
            <div class="team-title">🔴 RED</div>
            <div id="pRed" class="percent-val">50%</div>
            <div id="cRed" class="total-pts">0 P</div>
        </div>
        <div id="btnBlue" class="team-card blue" onclick="vote('blue')">
            <div class="team-title">🔵 BLUE</div>
            <div id="pBlue" class="percent-val">50%</div>
            <div id="cBlue" class="total-pts">0 P</div>
        </div>
    </div>

    <!-- 코인 선택 메뉴 -->
    <div class="chip-section">
        <div class="chip-label">코인 선택 후 선택한 팀 카드를 클릭해 투자하세요!</div>
        <div class="chip-container">
            <div class="chip selected" data-val="50" onclick="selectChip(50, this)">50</div>
            <div class="chip" data-val="100" onclick="selectChip(100, this)">100</div>
            <div class="chip" data-val="200" onclick="selectChip(200, this)">200</div>
            <div class="chip" data-val="500" onclick="selectChip(500, this)">500</div>
        </div>
    </div>

    <div id="statusMsg" class="status-box">팀을 선택해 포인트를 투자하세요!</div>

    <!-- 닉네임 입력 모달 -->
    <div id="nickModal" class="modal-overlay" style="display: flex;">
        <div class="nick-input-box">
            <h3 style="color: #00f0ff;">🙋‍♂️ 닉네임을 입력하세요</h3>
            <p style="font-size: 12px; color: #888;">이름/학번을 입력해 승부예측에 참여하세요.</p>
            <input type="text" id="nickInput" placeholder="예: 3학년1반 김철수" maxlength="12" onkeypress="if(event.key==='Enter') saveNickname()">
            <button class="action-btn" onclick="saveNickname()">입장하기</button>
        </div>
    </div>

    <!-- 관리자 패널 팝업 -->
    <div id="adminModal" class="modal-overlay">
        <h3 style="color: #ffd700; text-align: center;">👑 관리자 제어판</h3>
        
        <div style="display:flex; gap:8px;">
            <button class="action-btn settle-red" style="flex:1;" onclick="settleWinner('red')">🏆 RED 승리 (2배 지급)</button>
            <button class="action-btn settle-blue" style="flex:1;" onclick="settleWinner('blue')">🏆 BLUE 승리 (2배 지급)</button>
        </div>

        <button class="action-btn" onclick="giveAllUsers(1000)">🎁 모든 사용자에게 +1000P 지급</button>
        <button class="action-btn" style="border-color: #ff4d4f; color: #ff4d4f;" onclick="resetVotes()">⚠️ 정산 없이 투표 초기화</button>
        
        <h4 style="margin-top: 6px; font-size: 12px; color: #aaa;">현재 접속자 (<span id="onlineCount">0</span>명 온라인)</h4>
        <div id="userListContainer" style="display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;"></div>

        <button class="close-btn" onclick="closeAdmin()">닫기</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyANb0ouAJ9D9fEWcisDVZfvS75JEkS5GIE",
        authDomain: "firstdb-4a3c9.firebaseapp.com",
        databaseURL: "https://firstdb-4a3c9-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "firstdb-4a3c9",
        storageBucket: "firstdb-4a3c9.firebasestorage.app",
        messagingSenderId: "821652794885",
        appId: "1:821652794885:web:678488cac08c5ba9acf66c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myId = localStorage.getItem('appUserId');
    if (!myId) {
        myId = 'U_' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('appUserId', myId);
    }

    let myNick = localStorage.getItem('appUserNick');
    let myCurrentPoints = 0;
    let myVotedTeam = null;
    let myInvestedAmount = 0;
    let selectedAmount = 50;

    // 접속 시 저장된 닉네임이 이미 있으면 바로 세션 실행
    if (myNick && myNick.trim() !== "") {
        document.getElementById('nickModal').style.display = 'none';
        initUserSession();
    }

    function saveNickname() {
        const inputEl = document.getElementById('nickInput');
        const val = inputEl.value.trim();
        if (!val) { 
            alert("닉네임을 입력해주세요!"); 
            return; 
        }
        
        myNick = val;
        localStorage.setItem('appUserNick', myNick);
        document.getElementById('nickModal').style.display = 'none';
        
        // 데이터베이스에 즉시 저장
        db.ref('users/' + myId).update({ name: myNick });
        
        initUserSession();
    }

    function initUserSession() {
        document.getElementById('myNickDisplay').innerText = "👤 " + myNick;
        const userRef = db.ref('users/' + myId);

        userRef.on('value', (snapshot) => {
            const val = snapshot.val();
            if (!val) {
                userRef.set({ name: myNick, points: 1000, votedTeam: null, investedAmount: 0, online: true });
                myCurrentPoints = 1000;
                myVotedTeam = null;
                myInvestedAmount = 0;
            } else {
                myCurrentPoints = val.points || 0;
                myVotedTeam = val.votedTeam || null;
                myInvestedAmount = val.investedAmount || 0;
                if (val.name !== myNick) {
                    userRef.update({ name: myNick });
                }
            }
            
            document.getElementById('myPoint').innerText = myCurrentPoints.toLocaleString();
            updateUIState();
        });

        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const conRef = db.ref('users/' + myId + '/online');
                conRef.onDisconnect().set(false);
                conRef.set(true);
            }
        });
    }

    function updateUIState() {
        const btnRed = document.getElementById('btnRed');
        const btnBlue = document.getElementById('btnBlue');
        const statusMsg = document.getElementById('statusMsg');

        btnRed.classList.remove('locked');
        btnBlue.classList.remove('locked');

        if (myVotedTeam === 'red') {
            btnBlue.classList.add('locked');
            statusMsg.innerText = `🔴 RED팀 선택됨 (누적 투자: ${myInvestedAmount.toLocaleString()}P)`;
        } else if (myVotedTeam === 'blue') {
            btnRed.classList.add('locked');
            statusMsg.innerText = `🔵 BLUE팀 선택됨 (누적 투자: ${myInvestedAmount.toLocaleString()}P)`;
        } else {
            statusMsg.innerText = "원하는 팀을 터치해 투자하세요!";
        }
    }

    function selectChip(amount, el) {
        selectedAmount = amount;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    function vote(team) {
        if (!myNick) return;
        
        if (myVotedTeam && myVotedTeam !== team) {
            alert(`❌ 이미 ${myVotedTeam === 'red' ? 'RED' : 'BLUE'}팀을 선택하셨습니다!\n반대편 팀에는 투표할 수 없습니다.`);
            return;
        }

        if (myCurrentPoints < selectedAmount) {
            alert("❌ 잔여 포인트가 부족합니다!");
            return;
        }

        const newPoints = myCurrentPoints - selectedAmount;
        const newInvested = myInvestedAmount + selectedAmount;

        db.ref('users/' + myId).update({
            points: newPoints,
            votedTeam: team,
            investedAmount: newInvested
        });

        db.ref('votes/' + team).transaction((current) => (current || 0) + selectedAmount);
    }

    db.ref('votes').on('value', (snapshot) => {
        const data = snapshot.val() || { red: 0, blue: 0 };
        const red = data.red || 0;
        const blue = data.blue || 0;
        const total = red + blue;

        let rP = 50, bP = 50;
        if (total > 0) {
            rP = Math.round((red / total) * 100);
            bP = 100 - rP;
        }

        document.getElementById('pRed').innerText = rP + '%';
        document.getElementById('pBlue').innerText = bP + '%';
        document.getElementById('cRed').innerText = red.toLocaleString() + ' P';
        document.getElementById('cBlue').innerText = blue.toLocaleString() + ' P';
    });

    // --- 👑 관리자 시스템 ---
    const ADMIN_PIN = "7777";

    function tryAdminAccess() {
        const pin = prompt("관리자 비밀번호를 입력하세요:");
        if (pin === ADMIN_PIN) {
            document.getElementById('adminModal').style.display = 'flex';
            listenUserList();
        } else if (pin) {
            alert("비밀번호가 올바르지 않습니다.");
        }
    }

    function closeAdmin() {
        document.getElementById('adminModal').style.display = 'none';
    }

    function settleWinner(winningTeam) {
        const teamTitle = winningTeam === 'red' ? '🔴 RED' : '🔵 BLUE';
        if (!confirm(`${teamTitle} 팀의 승리로 정산하시겠습니까?\n승리 팀 투자자에게 2배 배당금이 지급되며 다음 라운드로 리셋됩니다.`)) return;

        db.ref('users').once('value', (snapshot) => {
            const users = snapshot.val() || {};
            const updates = {};

            Object.keys(users).forEach(uid => {
                const u = users[uid];
                let currentPts = u.points || 0;
                const invested = u.investedAmount || 0;

                if (u.votedTeam === winningTeam && invested > 0) {
                    currentPts += (invested * 2);
                }

                updates[`users/${uid}/points`] = currentPts;
                updates[`users/${uid}/votedTeam`] = null;
                updates[`users/${uid}/investedAmount`] = 0;
            });

            updates['votes/red'] = 0;
            updates['votes/blue'] = 0;

            db.ref().update(updates, (err) => {
                if (!err) {
                    alert(`🎉 ${teamTitle} 승리 정산이 완료되었습니다!`);
                } else {
                    alert("정산 처리 중 오류가 발생했습니다.");
                }
            });
        });
    }

    function listenUserList() {
        db.ref('users').on('value', (snapshot) => {
            const users = snapshot.val() || {};
            const container = document.getElementById('userListContainer');
            container.innerHTML = '';

            let onlineUsersCount = 0;

            Object.keys(users).forEach(uid => {
                const u = users[uid];
                const isOnline = u.online === true;
                if (isOnline) onlineUsersCount++;

                const votedStr = u.votedTeam ? (u.votedTeam === 'red' ? '🔴' : '🔵') : '⚪';

                const item = document.createElement('div');
                item.className = 'admin-user-item';
                item.innerHTML = `
                    <div>
                        <span>${isOnline ? '🟢' : '⚫'} <b>${u.name || '익명'}</b> [${votedStr}]</span>
                        <div style="font-size: 10px; color: #aaa;">잔여: ${u.points || 0}P | 투자: ${u.investedAmount || 0}P</div>
                    </div>
                    <button style="padding:4px 8px; background:#00f0ff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="givePoints('${uid}', 500)">+500P</button>
                `;
                container.appendChild(item);
            });

            document.getElementById('onlineCount').innerText = onlineUsersCount;
        });
    }

    function givePoints(targetUid, amount) {
        db.ref('users/' + targetUid + '/points').transaction((pts) => (pts || 0) + amount);
    }

    function giveAllUsers(amount) {
        db.ref('users').once('value', (snapshot) => {
            const users = snapshot.val() || {};
            Object.keys(users).forEach(uid => {
                db.ref('users/' + uid + '/points').transaction((pts) => (pts || 0) + amount);
            });
            alert(`모든 접속자에게 ${amount}P 지급 완료!`);
        });
    }

    function resetVotes() {
        if (confirm("정산 없이 투표 상태와 수치만 0으로 리셋하시겠습니까?")) {
            db.ref('votes').set({ red: 0, blue: 0 });
            db.ref('users').once('value', (snapshot) => {
                const users = snapshot.val() || {};
                const updates = {};
                Object.keys(users).forEach(uid => {
                    updates[`users/${uid}/votedTeam`] = null;
                    updates[`users/${uid}/investedAmount`] = 0;
                });
                db.ref().update(updates);
            });
            alert("투표가 초기화되었습니다.");
        }
    }
</script>
</body>
</html>
